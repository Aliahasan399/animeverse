<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shop all anime merchandise — figures, apparel, manga, accessories, posters, and plushies. Search and filter by category, series, and price.">
  <title>Shop All — AnimeVerse</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .shop-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 2rem;
      padding-top: 5rem;
    }

    /* Sidebar Filters */
    .filter-sidebar {
      position: sticky;
      top: 5rem;
      height: fit-content;
      max-height: calc(100vh - 6rem);
      overflow-y: auto;
      padding: 1.5rem;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--bg-glass);
      backdrop-filter: blur(8px);
      scrollbar-width: thin;
    }

    .filter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .filter-header h3 {
      font-size: 1rem;
      font-weight: 700;
    }

    .filter-clear {
      font-size: 0.75rem;
      color: var(--accent);
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      padding: 0.25rem 0.5rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .filter-clear:hover {
      background: var(--accent-dim);
    }

    .filter-group {
      margin-bottom: 1.25rem;
    }

    .filter-group:last-child {
      margin-bottom: 0;
    }

    .filter-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 0.6rem;
      display: block;
    }

    .filter-options {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .filter-option:hover {
      background: var(--accent-dim);
      color: var(--text-primary);
    }

    .filter-option input[type="checkbox"],
    .filter-option input[type="radio"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
    }

    .filter-option.active {
      color: var(--accent);
      background: var(--accent-dim);
    }

    .filter-count {
      margin-left: auto;
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    /* Price range */
    .price-range {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .price-range input {
      width: 100%;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-deep);
      color: var(--text-primary);
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
    }

    .price-range input:focus {
      border-color: var(--accent);
    }

    .price-range span {
      color: var(--text-dim);
      font-size: 0.75rem;
    }

    .price-apply {
      margin-top: 0.4rem;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: var(--accent-dim);
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    /* Shop header */
    .shop-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .shop-header-left h1 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      font-weight: 800;
    }

    .shop-header-left p {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .shop-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .shop-controls select {
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-deep);
      color: var(--text-primary);
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }

    .shop-controls select:focus {
      border-color: var(--accent);
    }

    .shop-grid .product-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 3rem;
    }

    .page-btn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--glass-bg);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 0.25s var(--ease);
      font-family: inherit;
    }

    .page-btn:hover,
    .page-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    .page-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Mobile filter toggle */
    .filter-toggle {
      display: none;
    }

    .filter-overlay {
      display: none;
    }

    @media (max-width: 820px) {
      .shop-layout { grid-template-columns: 1fr; }
      .filter-sidebar {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: 2000;
        max-height: 100vh;
        border-radius: 0;
        background: rgba(10,10,20,0.97);
        backdrop-filter: blur(20px);
        overflow-y: auto;
      }
      .filter-sidebar.open { display: block; }
      .filter-toggle { display: inline-flex; }
      .shop-grid .product-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 640px) {
      .shop-grid .product-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; }
      .shop-header { flex-direction: column; align-items: flex-start; }
    }

    @media (max-width: 420px) {
      .shop-grid .product-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar" id="navbar">
    <div class="container nav-container">
      <a href="index.html" class="nav-logo">
        <span class="logo-icon">✦</span>
        <span class="logo-text">AnimeVerse</span>
      </a>
      <div class="nav-menu" id="navMenu">
        <div class="nav-links">
          <a href="index.html" class="nav-link">Home</a>
          <a href="shop.html" class="nav-link active">Shop</a>
          <a href="shop.html?cat=Figures" class="nav-link">Figures</a>
          <a href="shop.html?cat=Apparel" class="nav-link">Apparel</a>
          <a href="shop.html?cat=Manga" class="nav-link">Manga</a>
        </div>
      </div>
      <div class="nav-actions">
        <button class="nav-action-btn" onclick="window.location.href='shop.html'" aria-label="Search">🔍</button>
        <button class="nav-action-btn" id="wishlistBtn" onclick="window.location.href='wishlist.html'" aria-label="Wishlist">
          ♥<span class="nav-badge" id="wishlistBadge">0</span>
        </button>
        <button class="nav-action-btn" onclick="window.location.href='cart.html'" aria-label="Cart">
          🛒<span class="nav-badge" id="cartBadge">0</span>
        </button>
        <button class="nav-toggle" id="navToggle" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <div class="container shop-layout">
    <!-- SIDEBAR FILTERS -->
    <aside class="filter-sidebar" id="filterSidebar">
      <div class="filter-header">
        <h3>🔍 Filters</h3>
        <button class="filter-clear" id="clearFilters">Clear All</button>
      </div>

      <!-- Search -->
      <div class="filter-group">
        <span class="filter-label">Search</span>
        <input type="text" id="searchInput" placeholder="Search products..." style="width:100%;padding:0.6rem 0.75rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-deep);color:var(--text-primary);font-size:0.82rem;font-family:inherit;outline:none;">
      </div>

      <!-- Category -->
      <div class="filter-group">
        <span class="filter-label">Category</span>
        <div class="filter-options" id="categoryFilters"></div>
      </div>

      <!-- Price Range -->
      <div class="filter-group">
        <span class="filter-label">Price Range</span>
        <div class="price-range">
          <input type="number" id="priceMin" placeholder="Min" min="0" step="0.01">
          <span>—</span>
          <input type="number" id="priceMax" placeholder="Max" min="0" step="0.01">
        </div>
        <button class="price-apply" id="applyPrice">Apply</button>
      </div>

      <!-- Sort -->
      <div class="filter-group">
        <span class="filter-label">Sort By</span>
        <select id="sortSelect" style="width:100%;padding:0.5rem 0.65rem;border-radius:8px;border:1px solid var(--border);background:var(--bg-deep);color:var(--text-primary);font-size:0.82rem;font-family:inherit;outline:none;cursor:pointer;">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: Low → High</option>
          <option value="price-desc">Price: High → Low</option>
          <option value="rating">Top Rated</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
    </aside>

    <!-- SHOP GRID -->
    <section class="shop-grid">
      <div class="shop-header">
        <div class="shop-header-left">
          <h1 id="shopTitle">All Products</h1>
          <p id="shopCount">Showing 36 products</p>
        </div>
        <div class="shop-controls">
          <button class="btn btn-outline btn-sm filter-toggle" id="filterToggle">🔍 Filters</button>
        </div>
      </div>

      <div class="product-grid" id="productGrid">
        <!-- Populated by JS -->
      </div>

      <div class="pagination" id="pagination">
        <!-- Populated by JS -->
      </div>
    </section>
  </div>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script>
    const shop = (() => {
      const PER_PAGE = 12;
      let currentPage = 1;
      let filtered = [...PRODUCTS];
      let activeCat = 'all';

      // ─── DOM Refs ──────────────────────────────────────
      const grid = document.getElementById('productGrid');
      const pagination = document.getElementById('pagination');
      const shopTitle = document.getElementById('shopTitle');
      const shopCount = document.getElementById('shopCount');
      const catFilters = document.getElementById('categoryFilters');
      const searchInput = document.getElementById('searchInput');
      const priceMin = document.getElementById('priceMin');
      const priceMax = document.getElementById('priceMax');
      const applyPrice = document.getElementById('applyPrice');
      const sortSelect = document.getElementById('sortSelect');
      const clearBtn = document.getElementById('clearFilters');
      const filterToggle = document.getElementById('filterToggle');
      const filterSidebar = document.getElementById('filterSidebar');

      // ─── Build Category Filters ────────────────────────
      function buildCategoryFilters() {
        const counts = {};
        PRODUCTS.forEach(p => { counts[p.category] = (counts[p.category] || 0) + 1; });
        const cats = Object.entries(counts);

        catFilters.innerHTML = `
          <label class="filter-option ${activeCat === 'all' ? 'active' : ''}">
            <input type="radio" name="cat" value="all" ${activeCat === 'all' ? 'checked' : ''}>
            All Categories
            <span class="filter-count">${PRODUCTS.length}</span>
          </label>
          ${cats.map(([cat, count]) => `
            <label class="filter-option ${activeCat === cat ? 'active' : ''}">
              <input type="radio" name="cat" value="${cat}" ${activeCat === cat ? 'checked' : ''}>
              ${cat}
              <span class="filter-count">${count}</span>
            </label>
          `).join('')}
        `;

        catFilters.querySelectorAll('input[name="cat"]').forEach(el => {
          el.addEventListener('change', () => {
            activeCat = el.value;
            catFilters.querySelectorAll('.filter-option').forEach(o => o.classList.remove('active'));
            el.closest('.filter-option')?.classList.add('active');
            currentPage = 1;
            applyFilters();
          });
        });
      }

      // ─── Apply Filters ─────────────────────────────────
      function applyFilters() {
        let result = [...PRODUCTS];

        // Category
        if (activeCat !== 'all') {
          result = result.filter(p => p.category === activeCat);
        }

        // Search
        const q = searchInput.value.trim().toLowerCase();
        if (q) {
          result = result.filter(p =>
            p.name.toLowerCase().includes(q) ||
            p.series.toLowerCase().includes(q) ||
            p.category.toLowerCase().includes(q)
          );
        }

        // Price
        const min = parseFloat(priceMin.value) || 0;
        const max = parseFloat(priceMax.value) || Infinity;
        result = result.filter(p => p.price >= min && p.price <= max);

        // Sort
        const sort = sortSelect.value;
        switch (sort) {
          case 'price-asc':  result.sort((a, b) => a.price - b.price); break;
          case 'price-desc': result.sort((a, b) => b.price - a.price); break;
          case 'rating':     result.sort((a, b) => b.rating - a.rating); break;
          case 'name':       result.sort((a, b) => a.name.localeCompare(b.name)); break;
          default: // featured — keep original order
        }

        filtered = result;
        currentPage = 1;
        render();
      }

      // ─── Render Grid + Pagination ──────────────────────
      function render() {
        const total = filtered.length;
        const totalPages = Math.ceil(total / PER_PAGE);
        const start = (currentPage - 1) * PER_PAGE;
        const pageItems = filtered.slice(start, start + PER_PAGE);

        shopTitle.textContent = q => q ? `Search: "${q}"` : activeCat === 'all' ? 'All Products' : activeCat;
        shopTitle.textContent = searchInput.value.trim()
          ? `Search: "${searchInput.value.trim()}"`
          : activeCat === 'all' ? 'All Products' : activeCat;
        shopCount.textContent = `Showing ${pageItems.length} of ${total} products`;

        if (pageItems.length === 0) {
          grid.innerHTML = `
            <div style="grid-column:1/-1;">
              <div class="empty-state">
                <div class="empty-state-icon">🔍</div>
                <h3>No products found</h3>
                <p>Try adjusting your filters or search term.</p>
                <button class="btn btn-outline btn-sm" onclick="document.getElementById('clearFilters').click()">Clear Filters</button>
              </div>
            </div>
          `;
        } else {
          grid.innerHTML = pageItems.map(p => AnimeVerse.renderProductCard(p)).join('');
        }

        // Pagination
        if (totalPages <= 1) {
          pagination.innerHTML = '';
          return;
        }

        let html = '';
        html += `<button class="page-btn" onclick="shop.goPage(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>‹</button>`;
        for (let i = 1; i <= totalPages; i++) {
          html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="shop.goPage(${i})">${i}</button>`;
        }
        html += `<button class="page-btn" onclick="shop.goPage(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>›</button>`;
        pagination.innerHTML = html;
      }

      function goPage(page) {
        const totalPages = Math.ceil(filtered.length / PER_PAGE);
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        render();
        grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      // ─── Init ──────────────────────────────────────────
      function init() {
        // Read URL params
        const params = new URLSearchParams(window.location.search);
        const catParam = params.get('cat');
        const qParam = params.get('q');
        if (catParam && CATEGORIES.includes(catParam)) activeCat = catParam;
        if (qParam) searchInput.value = qParam;

        buildCategoryFilters();

        // Set initial radio
        catFilters.querySelector(`input[value="${activeCat}"]`)?.click();

        // Event listeners
        let searchTimer;
        searchInput.addEventListener('input', () => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => { currentPage = 1; applyFilters(); }, 300);
        });

        sortSelect.addEventListener('change', applyFilters);
        applyPrice.addEventListener('click', () => { currentPage = 1; applyFilters(); });

        clearBtn.addEventListener('click', () => {
          activeCat = 'all';
          searchInput.value = '';
          priceMin.value = '';
          priceMax.value = '';
          sortSelect.value = 'featured';
          catFilters.querySelector('input[value="all"]')?.click();
          catFilters.querySelectorAll('.filter-option').forEach(o => o.classList.remove('active'));
          catFilters.querySelector('input[value="all"]')?.closest('.filter-option')?.classList.add('active');
          currentPage = 1;
          applyFilters();
        });

        filterToggle?.addEventListener('click', () => {
          filterSidebar?.classList.toggle('open');
        });

        // Close sidebar on outside click
        document.addEventListener('click', (e) => {
          if (filterSidebar?.classList.contains('open') &&
              !filterSidebar.contains(e.target) &&
              !filterToggle?.contains(e.target)) {
            filterSidebar.classList.remove('open');
          }
        });

        applyFilters();
      }

      return { init, goPage };
    })();

    document.addEventListener('DOMContentLoaded', () => shop.init());
  </script>

</body>
</html>
